name: kernelpackage

# The kernel and the bootloader are built in a single run because there is one
# deliverable: the KernelPackage. Separate workflows could not assemble it —
# artifacts from another run are not downloadable without a token, and gokrazy
# requires the bootloader to live inside the package next to vmlinuz.
#
# The cache layers are kept separate: the kernel takes ~50 minutes to build and
# the bootloader ~1 minute, so touching one must not rebuild the other.

on:
  push:
    branches: [main]
    tags: ["kernelpackage-v*"]
    paths:
      - config/**
      - dts/**
      - uboot/**
      - kernel/**
      - scripts/**
      - container.digest
      - .github/workflows/kernelpackage.yml
  pull_request:
    paths:
      - config/**
      - dts/**
      - uboot/**
      - scripts/**
  workflow_dispatch:

# The commit that updates container.digest is made by the "container" workflow
# under GITHUB_TOKEN, and such pushes do not trigger other workflows. After a
# digest bump, start the build manually: gh workflow run kernelpackage.yml

concurrency:
  group: kernelpackage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publishing a release on tag
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Keys are computed over everything that affects the given artifact. A
      # forgotten directory means a stale artifact gets served from the cache.
      - id: keys
        run: |
          kern=$(cat Dockerfile container.digest config/* dts/* kernel/* \
                 firmware/* scripts/build-kernel.sh scripts/verify-kernel.sh \
                 scripts/fetch-firmware.sh 2>/dev/null | sha256sum | cut -c1-16)
          boot=$(cat Dockerfile container.digest uboot/* dts/* \
                 scripts/build-uboot.sh 2>/dev/null | sha256sum | cut -c1-16)
          echo "kernel=$kern" >> "$GITHUB_OUTPUT"
          echo "uboot=$boot" >> "$GITHUB_OUTPUT"

      - id: kernel-cache
        uses: actions/cache@v4
        with:
          path: out/kernel
          key: kernel-artifact-${{ steps.keys.outputs.kernel }}

      - id: uboot-cache
        uses: actions/cache@v4
        with:
          path: out/uboot
          key: uboot-artifact-${{ steps.keys.outputs.uboot }}

      - uses: actions/cache@v4
        with:
          path: downloads
          key: sources-${{ hashFiles('kernel/*.sha256', 'uboot/*.sha256') }}
          restore-keys: sources-

      - if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.keys.outputs.kernel }}
          restore-keys: ccache-

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          image=$(cat container.digest)
          mkdir -p ~/.ccache
          docker run --rm -v "$PWD:/work" -w /work \
            -v "$HOME/.ccache:/root/.ccache" -e CCACHE_MAXSIZE=2G \
            -e BUILD_CONTAINER_DIGEST="$image" \
            "$image" bash scripts/build-kernel.sh

      # Always downloaded: the files are small, and missing firmware would only
      # surface on the board as a silent radio.
      - name: Firmware
        run: |
          image=$(cat container.digest)
          docker run --rm -v "$PWD:/work" -w /work \
            "$image" bash scripts/fetch-firmware.sh

      - name: Build bootloader
        if: steps.uboot-cache.outputs.cache-hit != 'true'
        run: |
          image=$(cat container.digest)
          docker run --rm -v "$PWD:/work" -w /work \
            -e BUILD_CONTAINER_DIGEST="$image" \
            "$image" bash scripts/build-uboot.sh

      - name: Package
        run: |
          image=$(cat container.digest)
          docker run --rm -v "$PWD:/work" -w /work \
            -e BUILD_CONTAINER_DIGEST="$image" \
            "$image" bash scripts/package-kernel.sh

      # Always runs, even when both layers came from the cache: a cached
      # artifact is no better than a fresh one until it has been verified.
      - name: Verify
        run: |
          scripts/verify-package.sh dist/kernelpackage
          (cd dist && sha256sum -c ./*.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: kernelpackage-${{ steps.keys.outputs.kernel }}-${{ steps.keys.outputs.uboot }}
          path: |
            dist/*.tar.zst
            dist/*.sha256
            dist/kernelpackage/kernelpackage.yaml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.zst dist/*.sha256 \
            --title "KernelPackage ${GITHUB_REF_NAME}" \
            --notes "Kernel, DTB, bootloader and modules in one package. Contents: kernelpackage.yaml."
